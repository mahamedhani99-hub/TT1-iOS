name: Build iOS IPA (No-Mac Cloud Build)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build TT1 Keyboard IPA
    runs-on: macos-15
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app

      - name: Build and Archive
        run: |
          xcodebuild clean archive \
            -project TT1App/TT1App.xcodeproj \
            -scheme TT1App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/TT1App.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/TT1App.xcarchive/Products/Applications/TT1App.app Payload/
          zip -r TT1App.ipa Payload
          mkdir -p output
          mv TT1App.ipa output/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TT1App-iOS
          path: output/TT1App.ipa
          retention-days: 14
